[package]
name = "ournotes-sim"
description = "Deck power, skip score, live score and the whole-live simulation of BanG Dream! Our Notes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.en.md"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
sha2 = { version = "0.11", default-features = false }

[build-dependencies]
sha2 = { version = "0.11", default-features = false }

[features]
search-diagnostics = []
# Tests against reference vectors that are not distributed with the crate; see tests/reference/mod.rs.
native-fixtures = []
