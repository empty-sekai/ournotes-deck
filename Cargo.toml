[package]
name = "ournotes-deck"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Deck power, skip score and live score for BanG Dream! Our Notes, with an exact Top-K deck search"
license = "MIT OR Apache-2.0"
repository = "https://github.com/empty-sekai/ournotes-deck"
readme = "README.en.md"
publish = false
include = [
    "/Cargo.toml",
    "/README.md",
    "/README.en.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/src/**",
    "/docs/**",
]

[lints.clippy]
# Slot and position loops index several parallel arrays at once.
needless_range_loop = "allow"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }

[profile.release]
debug = 1
