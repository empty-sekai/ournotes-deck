[package]
name = "ournotes-recommend-wasm"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ournotes-deck = { path = "../.." }
serde_json = { version = "1", features = ["arbitrary_precision"] }
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

