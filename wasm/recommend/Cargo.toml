[package]
name = "ournotes-recommend-wasm"
version = "0.0.10"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ournotes-search = { path = "../../crates/ournotes-search" }
ournotes-sim = { path = "../../crates/ournotes-sim" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2.14", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

