name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features native-fixtures -- -D warnings
      - run: cargo test --release

  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --features search-diagnostics --test adapter_fixture_export

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - run: cargo check --all-targets

  account-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact WASM binding tool
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Export synthetic native account references
        env:
          OURNOTES_ACCOUNT_CORPUS: ${{ github.workspace }}/work/account-corpus
        run: cargo test --release --locked --test adapter_fixture_export export_account_transport_corpus -- --ignored --exact
      - name: Build production recommendation WASM
        run: cargo build --release --locked --target wasm32-unknown-unknown --manifest-path wasm/recommend/Cargo.toml
      - name: Bind and compare exact native and WASM account semantics
        run: |
          wasm-bindgen --target nodejs --out-dir work/account-bindings wasm/recommend/target/wasm32-unknown-unknown/release/ournotes_recommend_wasm.wasm
          node tools/search-harness/account-wasm.cjs work/account-bindings/ournotes_recommend_wasm.js work/account-corpus work/account-wasm-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: account-wasm-report
          path: work/account-wasm-report.json
          if-no-files-found: error

  synthetic-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m unittest discover -s tools/native-validation -p 'test_*.py'
      - run: python3 -m unittest discover -s tools/search-harness -p 'test_*.py'
      - name: Export synthetic search inputs
        env:
          BDON_HARNESS_OUT: ${{ github.workspace }}/work/corpus
        run: cargo test --release --locked --test adapter_fixture_export export_search_harness_inputs -- --ignored
      - run: cargo build --release --locked --manifest-path tools/search-harness/Cargo.toml --bin ournotes-search-harness
      - name: Compare independent team enumeration
        run: python3 tools/search-harness/run.py run --binary tools/search-harness/target/release/ournotes-search-harness --suite work/corpus/suite.json --out work/corpus-results
