name: Release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          git show "$commit:Cargo.toml" > /tmp/release-Cargo.toml
          python3 -c 'import os,tomllib; assert tomllib.load(open("/tmp/release-Cargo.toml","rb"))["workspace"]["package"]["version"] == os.environ["TAG"][1:]'
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  native:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
      BUILD_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v7
        with:
          path: automation
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: source
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static Linux linker
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          linker_key="CARGO_TARGET_$(echo "$BUILD_TARGET" | tr 'a-z-' 'A-Z_')_LINKER"
          echo "$linker_key=musl-gcc" >> "$GITHUB_ENV"
      - name: Build tagged CLI binaries
        working-directory: source
        run: cargo build --release --locked --target "$BUILD_TARGET" --bins
      - name: Export synthetic CLI inputs
        working-directory: source
        env:
          BDON_HARNESS_OUT: ${{ github.workspace }}/source/work/corpus
        run: cargo test --release --locked --target "$BUILD_TARGET" --test adapter_fixture_export export_search_harness_inputs -- --ignored --exact
      - name: Package and run extracted binaries
        run: |
          python automation/scripts/release/package.py native --source source --output dist --tag "$TAG" --commit "$SOURCE_COMMIT" --target "$BUILD_TARGET"
          python automation/scripts/release/smoke-native.py dist source/work/corpus
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wasm:
    needs: resolve
    uses: ./.github/workflows/wasm.yml
    with:
      source-commit: ${{ needs.resolve.outputs.commit }}
      tag: ${{ needs.resolve.outputs.tag }}

  publish:
    needs: [resolve, native, wasm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - name: Require passing source CI
        run: |
          for attempt in $(seq 1 90); do
            gh api "repos/$GH_REPO/commits/$SOURCE_COMMIT/check-runs?filter=latest&per_page=100" > /tmp/source-checks.json
            if python3 -c 'import json,sys; checks=json.load(open("/tmp/source-checks.json"))["check_runs"]; required=[next((c for c in checks if c["name"]==name),None) for name in ("test","diagnostics","msrv","synthetic-correctness")]; failed=any(c and c["status"]=="completed" and c["conclusion"]!="success" for c in required); passed=all(c and c["status"]=="completed" and c["conclusion"]=="success" for c in required); sys.exit(2 if failed else 0 if passed else 1)'; then
              break
            else
              state=$?
              test "$state" -eq 1 || exit "$state"
            fi
            test "$attempt" -lt 90
            sleep 20
          done
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Hash and publish all verified packages
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$SOURCE_COMMIT"
          cd dist
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 7
          sha256sum * > SHA256SUMS
          gh release view "$TAG" >/dev/null || gh release create "$TAG" --verify-tag --title "ournotes-deck $TAG" --generate-notes
          gh release upload "$TAG" *
          gh release download "$TAG" --dir ../readback
          cd ../readback
          sha256sum -c SHA256SUMS
          echo "Published $TAG from $SOURCE_COMMIT; all seven downloaded packages match SHA256SUMS." >> "$GITHUB_STEP_SUMMARY"
